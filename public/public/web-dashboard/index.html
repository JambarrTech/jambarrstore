<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JambarrTech • Dashboard Admin & Gérant (Web)</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
</head>
<body class="h-full bg-slate-100 font-sans text-slate-900 flex" onload="loadDashboard()">
  <!-- Sidebar -->
  <aside class="w-64 bg-white border-r border-slate-200 flex flex-col">
    <div class="p-6 border-b border-slate-100 flex items-center gap-3">
      <div class="w-10 h-10 bg-gradient-to-br from-[#0A3C8C] to-[#0F52BA] rounded-xl flex items-center justify-center text-white font-black text-lg shadow-md ring-2 ring-blue-100">JT</div>
      <div>
        <h1 class="font-bold text-base text-slate-800 tracking-tight">JambarrShop</h1>
        <p class="text-[10px] text-slate-500 font-semibold tracking-wider uppercase">Crée • Gère • Vends</p>
      </div>
    </div>
    <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
      <button onclick="switchTab('dashboard')" id="nav-dashboard" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-50 text-[#0F52BA] font-semibold text-sm transition">
        <span class="material-symbols-outlined">dashboard</span> Tableau de bord
      </button>
      <button onclick="switchTab('products')" id="nav-products" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 text-sm font-medium transition">
        <span class="material-symbols-outlined">inventory_2</span> Produits
      </button>
      <button onclick="switchTab('orders')" id="nav-orders" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 text-sm font-medium transition">
        <span class="material-symbols-outlined">shopping_bag</span> Commandes
      </button>
      <button onclick="switchTab('payments')" id="nav-payments" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 text-sm font-medium transition">
        <span class="material-symbols-outlined">payments</span> Paiements (Wave / OM)
      </button>
      <button onclick="switchTab('reviews')" id="nav-reviews" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 text-sm font-medium transition">
        <span class="material-symbols-outlined">star</span> Avis Clients
      </button>
      <button onclick="switchTab('logs')" id="nav-logs" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 text-sm font-medium transition">
        <span class="material-symbols-outlined">history</span> Journaux d'activité
      </button>
      <button onclick="switchTab('settings')" id="nav-settings" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 text-sm font-medium transition">
        <span class="material-symbols-outlined">settings</span> Paramètres
      </button>
    </nav>
    <div class="p-4 border-t border-slate-100">
      <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl">
        <div class="w-9 h-9 rounded-full bg-slate-300 flex items-center justify-center font-bold text-slate-700">AB</div>
        <div class="flex-1 truncate">
          <p class="text-xs font-bold text-slate-800 truncate">Amadou Ba</p>
          <p class="text-[10px] text-slate-500 truncate">admin@jambarrtech.com</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col h-full overflow-hidden">
    <header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between">
      <h2 id="pageTitle" class="text-lg font-bold text-slate-800">Tableau de bord Général</h2>
      <div class="flex items-center gap-4">
        <span class="px-3 py-1 bg-green-100 text-green-700 text-xs font-bold rounded-full">Serveur API Connecté</span>
        <button onclick="openAddProductModal()" class="px-4 py-2 bg-[#0F52BA] text-white text-xs font-bold rounded-xl shadow hover:bg-blue-800">+ Nouveau Produit</button>
      </div>
    </header>

    <!-- Content Area -->
    <div class="flex-1 p-8 overflow-y-auto space-y-8" id="mainContentArea">
      <!-- Dynamically Rendered -->
    </div>
  </main>

  <!-- Add Product Modal -->
  <div id="addProductModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-base text-slate-800">Ajouter un nouveau produit</h3>
        <button onclick="closeAddProductModal()" class="text-slate-400 font-bold hover:text-slate-600">✕</button>
      </div>
      <form onsubmit="handleProductSubmit(event)" class="space-y-3">
        <div>
          <label class="text-xs font-bold text-slate-600">Nom du produit</label>
          <input type="text" id="prodName" required class="w-full mt-1 px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0F52BA]">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-bold text-slate-600">Prix (FCFA)</label>
            <input type="number" id="prodPrice" required class="w-full mt-1 px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0F52BA]">
          </div>
          <div>
            <label class="text-xs font-bold text-slate-600">Stock</label>
            <input type="number" id="prodStock" required value="10" class="w-full mt-1 px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0F52BA]">
          </div>
        </div>
        <div>
          <label class="text-xs font-bold text-slate-600">URL de l'image (Unsplash)</label>
          <input type="url" id="prodImage" required value="https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=600" class="w-full mt-1 px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0F52BA]">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-600">Description</label>
          <textarea id="prodDesc" rows="2" class="w-full mt-1 px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0F52BA]"></textarea>
        </div>
        <button type="submit" class="w-full py-3 bg-[#0F52BA] text-white font-bold rounded-xl text-sm shadow hover:bg-blue-800 mt-2">Enregistrer le produit</button>
      </form>
    </div>
  </div>

  <script>
    let currentTab = 'dashboard';
    let globalStats = null;
    let globalProducts = [];
    let globalOrders = [];
    let globalPayments = [];
    let globalReviews = [];
    let globalLogs = [];
    let globalSettings = {};

    async function loadDashboard() {
      try {
        const [statsRes, prodRes, ordRes, payRes, revRes, logRes, settRes] = await Promise.all([
          fetch('/api/stats').then(r => r.json()),
          fetch('/api/products').then(r => r.json()),
          fetch('/api/orders').then(r => r.json()),
          fetch('/api/payments').then(r => r.json()),
          fetch('/api/reviews').then(r => r.json()),
          fetch('/api/activity-logs').then(r => r.json()),
          fetch('/api/settings').then(r => r.json())
        ]);
        globalStats = statsRes;
        globalProducts = prodRes;
        globalOrders = ordRes;
        globalPayments = payRes;
        globalReviews = revRes;
        globalLogs = logRes;
        globalSettings = settRes;
        renderTabContent();
      } catch (err) {
        console.error("Erreur de chargement API", err);
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      ['dashboard', 'products', 'orders', 'payments', 'reviews', 'logs', 'settings'].forEach(t => {
        const btn = document.getElementById('nav-' + t);
        if (btn) {
          if (t === tab) {
            btn.className = "w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-50 text-[#0F52BA] font-semibold text-sm transition";
          } else {
            btn.className = "w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 text-sm font-medium transition";
          }
        }
      });
      renderTabContent();
    }

    function renderTabContent() {
      const area = document.getElementById('mainContentArea');
      const title = document.getElementById('pageTitle');

      if (currentTab === 'dashboard') {
        title.innerText = "Tableau de bord Général";
        area.innerHTML = `
          <!-- Stats Row -->
          <div class="grid grid-cols-4 gap-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
              <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Chiffre d'Affaires</p>
              <p class="text-2xl font-bold text-slate-800 mt-2">${globalStats?.totalRevenue || '12 450 000 FCFA'}</p>
              <span class="text-xs text-green-600 font-bold mt-1 inline-block">+18.4% ce mois</span>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
              <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Commandes Totales</p>
              <p class="text-2xl font-bold text-slate-800 mt-2">${globalStats?.totalOrders || '1,428'}</p>
              <span class="text-xs text-green-600 font-bold mt-1 inline-block">+8.1% vs hier</span>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
              <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Clients Actifs</p>
              <p class="text-2xl font-bold text-slate-800 mt-2">${globalStats?.totalClients || '1,280'}</p>
              <span class="text-xs text-green-600 font-bold mt-1 inline-block">+15.3% nouveaux</span>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
              <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Panier Moyen</p>
              <p class="text-2xl font-bold text-slate-800 mt-2">45 000 FCFA</p>
              <span class="text-xs text-green-600 font-bold mt-1 inline-block">+3.2% stable</span>
            </div>
          </div>

          <!-- Recent Orders Table -->
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
            <div class="flex justify-between items-center mb-6">
              <h3 class="font-bold text-base text-slate-800">Commandes Récentes & Transactions (Wave & Orange Money)</h3>
              <button onclick="switchTab('orders')" class="text-xs font-bold text-[#0F52BA] uppercase">Voir toutes</button>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-slate-100 text-xs font-bold text-slate-400 uppercase">
                    <th class="pb-3">Référence</th>
                    <th class="pb-3">Client</th>
                    <th class="pb-3">Montant</th>
                    <th class="pb-3">Paiement</th>
                    <th class="pb-3">Statut</th>
                  </tr>
                </thead>
                <tbody class="text-sm divide-y divide-slate-100">
                  ${globalOrders.slice(0, 5).map(o => `
                    <tr>
                      <td class="py-4 font-bold text-slate-800">#${o.reference}</td>
                      <td class="py-4 text-slate-600">${o.clientName}</td>
                      <td class="py-4 font-bold text-[#0F52BA]">${o.totalAmount.toLocaleString()} FCFA</td>
                      <td class="py-4"><span class="px-2.5 py-1 bg-green-50 text-green-600 text-xs font-bold rounded-lg">${o.paymentMethod}</span></td>
                      <td class="py-4"><span class="px-2.5 py-1 bg-blue-50 text-blue-600 text-xs font-bold rounded-lg">${o.status}</span></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      } else if (currentTab === 'products') {
        title.innerText = "Gestion des Produits";
        area.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
            <div class="flex justify-between items-center mb-6">
              <h3 class="font-bold text-base text-slate-800">Catalogue des Produits (${globalProducts.length})</h3>
              <button onclick="openAddProductModal()" class="px-4 py-2 bg-[#0F52BA] text-white text-xs font-bold rounded-xl shadow">+ Ajouter un produit</button>
            </div>
            <div class="grid grid-cols-3 gap-6">
              ${globalProducts.map(p => `
                <div class="border border-slate-200 rounded-2xl p-4 flex flex-col justify-between bg-slate-50 relative">
                  ${p.stock < 5 ? '<span class="absolute top-3 right-3 flex h-3 w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-red-500" title="Stock critique (< 5 unités)"></span></span>' : ''}
                  <div class="aspect-square bg-white rounded-xl overflow-hidden mb-3">
                    <img src="${p.imageUrl}" class="w-full h-full object-cover" alt="${p.name}">
                  </div>
                  <div>
                    <h4 class="font-bold text-slate-800 text-sm">${p.name}</h4>
                    <p class="text-xs text-slate-500 mt-0.5 flex items-center gap-1.5">
                      Réf: ${p.reference} • Stock: <span class="${p.stock < 5 ? 'text-red-600 font-bold' : ''}">${p.stock}</span>
                    </p>
                    <p class="text-base font-extrabold text-[#0F52BA] mt-2">${p.price.toLocaleString()} FCFA</p>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else if (currentTab === 'orders') {
        title.innerText = "Gestion des Commandes";
        area.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
            <h3 class="font-bold text-base text-slate-800 mb-6">Toutes les Commandes Clients (${globalOrders.length})</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-slate-100 text-xs font-bold text-slate-400 uppercase">
                    <th class="pb-3">Référence</th>
                    <th class="pb-3">Client</th>
                    <th class="pb-3">Montant</th>
                    <th class="pb-3">Paiement</th>
                    <th class="pb-3">Statut</th>
                    <th class="pb-3">Date</th>
                  </tr>
                </thead>
                <tbody class="text-sm divide-y divide-slate-100">
                  ${globalOrders.map(o => `
                    <tr>
                      <td class="py-4 font-bold text-slate-800">#${o.reference}</td>
                      <td class="py-4 text-slate-600">${o.clientName}</td>
                      <td class="py-4 font-bold text-[#0F52BA]">${o.totalAmount.toLocaleString()} FCFA</td>
                      <td class="py-4"><span class="px-2.5 py-1 bg-green-50 text-green-600 text-xs font-bold rounded-lg">${o.paymentMethod}</span></td>
                      <td class="py-4"><span class="px-2.5 py-1 bg-blue-50 text-blue-600 text-xs font-bold rounded-lg">${o.status}</span></td>
                      <td class="py-4 text-xs text-slate-400">${o.createdAt}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      } else if (currentTab === 'payments') {
        title.innerText = "Transactions de Paiement (Wave & Orange Money)";
        area.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
            <h3 class="font-bold text-base text-slate-800 mb-6">Transactions Réussies (${globalPayments.length})</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-slate-100 text-xs font-bold text-slate-400 uppercase">
                    <th class="pb-3">ID Transaction</th>
                    <th class="pb-3">Client</th>
                    <th class="pb-3">Méthode</th>
                    <th class="pb-3">Montant</th>
                    <th class="pb-3">Statut</th>
                    <th class="pb-3">Date</th>
                  </tr>
                </thead>
                <tbody class="text-sm divide-y divide-slate-100">
                  ${globalPayments.map(tx => `
                    <tr>
                      <td class="py-4 font-bold text-slate-800">${tx.reference}</td>
                      <td class="py-4 text-slate-600">${tx.clientName}</td>
                      <td class="py-4"><span class="px-2.5 py-1 bg-blue-50 text-[#0F52BA] text-xs font-bold rounded-lg">${tx.method}</span></td>
                      <td class="py-4 font-bold text-[#0F52BA]">${tx.amount.toLocaleString()} FCFA</td>
                      <td class="py-4"><span class="px-2.5 py-1 bg-emerald-50 text-emerald-600 text-xs font-bold rounded-lg">${tx.status}</span></td>
                      <td class="py-4 text-xs text-slate-400">${tx.date}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      } else if (currentTab === 'reviews') {
        title.innerText = "Modération des Avis Clients";
        const pendingReviews = globalReviews.filter(r => r.status === 'pending');
        const approvedReviews = globalReviews.filter(r => r.status === 'approved');
        area.innerHTML = `
          <div class="space-y-8">
            <!-- Pending Reviews Section -->
            <div class="bg-white rounded-2xl border border-amber-200 shadow-sm p-6">
              <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-base text-slate-800 flex items-center gap-2">
                  <span>⏳</span> Avis en attente de modération (${pendingReviews.length})
                </h3>
              </div>
              ${pendingReviews.length === 0 ? '<p class="text-xs text-slate-400 italic">Aucun avis en attente.</p>' : `
                <div class="space-y-4">
                  ${pendingReviews.map(r => `
                    <div class="border border-amber-200 rounded-2xl p-4 bg-amber-50/50 flex flex-col gap-3">
                      <div class="flex justify-between items-center">
                        <div class="flex items-center gap-2">
                          <div class="w-8 h-8 bg-amber-100 text-amber-700 font-bold rounded-full flex items-center justify-center text-xs">${r.clientName.substring(0, 2).toUpperCase()}</div>
                          <div>
                            <h4 class="font-bold text-slate-800 text-xs">${r.clientName}</h4>
                            <p class="text-[10px] text-slate-400">${r.createdAt}</p>
                          </div>
                        </div>
                        <div class="flex items-center gap-3">
                          <span class="text-amber-500 font-bold text-xs">${'★'.repeat(r.rating)}</span>
                        </div>
                      </div>
                      <p class="text-xs text-slate-700 italic">"${r.comment}"</p>
                      <div class="flex justify-end gap-2 pt-2 border-t border-amber-200/60">
                        <button onclick="deleteReview('${r.id}')" class="px-3 py-1.5 bg-white border border-red-200 text-red-600 text-xs font-bold rounded-xl hover:bg-red-50 transition">Supprimer</button>
                        <button onclick="approveReview('${r.id}')" class="px-4 py-1.5 bg-emerald-600 text-white text-xs font-bold rounded-xl shadow hover:bg-emerald-700 transition">Approuver</button>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>

            <!-- Approved Reviews Section -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
              <h3 class="font-bold text-base text-slate-800 mb-4 flex items-center gap-2">
                <span>✅</span> Avis approuvés & publiés (${approvedReviews.length})
              </h3>
              <div class="space-y-4">
                ${approvedReviews.map(r => `
                  <div class="border border-slate-200 rounded-2xl p-4 bg-slate-50 flex flex-col gap-3">
                    <div class="flex justify-between items-center">
                      <div class="flex items-center gap-2">
                        <div class="w-8 h-8 bg-blue-100 text-[#0F52BA] font-bold rounded-full flex items-center justify-center text-xs">${r.clientName.substring(0, 2).toUpperCase()}</div>
                        <div>
                          <h4 class="font-bold text-slate-800 text-xs">${r.clientName}</h4>
                          <p class="text-[10px] text-slate-400">${r.createdAt}</p>
                        </div>
                      </div>
                      <span class="text-amber-500 font-bold text-xs">${'★'.repeat(r.rating)}</span>
                    </div>
                    <p class="text-xs text-slate-600">"${r.comment}"</p>
                    <div class="flex justify-end pt-2 border-t border-slate-200">
                      <button onclick="deleteReview('${r.id}')" class="px-3 py-1 bg-white border border-slate-200 text-red-600 text-xs font-bold rounded-xl hover:bg-red-50 transition">Supprimer</button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      } else if (currentTab === 'logs') {
        title.innerText = "Journaux d'Activité Administrateur";
        area.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
            <h3 class="font-bold text-base text-slate-800 mb-6">Logs Système & Actions Gérants</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-slate-100 text-xs font-bold text-slate-400 uppercase">
                    <th class="pb-3">Action</th>
                    <th class="pb-3">Utilisateur</th>
                    <th class="pb-3">Module</th>
                    <th class="pb-3">Date</th>
                    <th class="pb-3">Résultat</th>
                  </tr>
                </thead>
                <tbody class="text-sm divide-y divide-slate-100">
                  ${globalLogs.map(l => `
                    <tr>
                      <td class="py-4 font-bold text-slate-800">${l.action}</td>
                      <td class="py-4 text-slate-600">${l.user}</td>
                      <td class="py-4"><span class="px-2.5 py-1 bg-slate-100 text-slate-700 text-xs font-bold rounded-lg">${l.module}</span></td>
                      <td class="py-4 text-xs text-slate-400">${l.date}</td>
                      <td class="py-4"><span class="px-2.5 py-1 bg-green-50 text-green-600 text-xs font-bold rounded-lg">${l.result}</span></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      } else if (currentTab === 'settings') {
        title.innerText = "Paramètres de la Plateforme";
        area.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 max-w-3xl">
            <h3 class="font-bold text-base text-slate-800 mb-6">Configuration de JambarrTech & Seuils de Commissions</h3>
            <form onsubmit="saveSettings(event)" class="space-y-6">
              <div class="grid grid-cols-2 gap-6">
                <div>
                  <label class="text-xs font-bold text-slate-600">Nom de la boutique</label>
                  <input type="text" id="storeName" value="${globalSettings.storeName || ''}" required class="w-full mt-1.5 px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0F52BA]">
                </div>
                <div>
                  <label class="text-xs font-bold text-slate-600">E-mail de contact</label>
                  <input type="email" id="storeEmail" value="${globalSettings.storeEmail || ''}" required class="w-full mt-1.5 px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0F52BA]">
                </div>
              </div>
              <div class="grid grid-cols-2 gap-6">
                <div>
                  <label class="text-xs font-bold text-slate-600">Téléphone</label>
                  <input type="text" id="phone" value="${globalSettings.phone || ''}" required class="w-full mt-1.5 px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0F52BA]">
                </div>
                <div>
                  <label class="text-xs font-bold text-slate-600">Adresse</label>
                  <input type="text" id="address" value="${globalSettings.address || ''}" required class="w-full mt-1.5 px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0F52BA]">
                </div>
              </div>
              <div>
                <label class="text-xs font-bold text-slate-600">URL du Logo / Image</label>
                <input type="url" id="logoUrl" value="${globalSettings.logoUrl || ''}" required class="w-full mt-1.5 px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0F52BA]">
              </div>
              
              <hr class="border-slate-100 my-4">
              
              <h4 class="font-bold text-sm text-slate-800">Gestion des Seuils de Commissions sur les Ventes</h4>
              <div class="grid grid-cols-2 gap-6">
                <div>
                  <label class="text-xs font-bold text-slate-600">Taux de Commission (%)</label>
                  <input type="number" step="0.1" id="commissionRate" value="${globalSettings.commissionRate || 5.0}" required class="w-full mt-1.5 px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0F52BA]">
                  <p class="text-[10px] text-slate-400 mt-1">Pourcentage prélevé sur chaque vente effectuée.</p>
                </div>
                <div>
                  <label class="text-xs font-bold text-slate-600">Commission Minimum (FCFA)</label>
                  <input type="number" id="minCommission" value="${globalSettings.minCommission || 500}" required class="w-full mt-1.5 px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0F52BA]">
                  <p class="text-[10px] text-slate-400 mt-1">Montant plancher de commission par transaction.</p>
                </div>
              </div>

              <button type="submit" class="px-6 py-3 bg-[#0F52BA] text-white font-bold rounded-xl text-sm shadow hover:bg-blue-800 transition">Enregistrer les modifications</button>
            </form>
          </div>
        `;
      }
    }

    function openAddProductModal() {
      document.getElementById('addProductModal').classList.remove('hidden');
    }

    function closeAddProductModal() {
      document.getElementById('addProductModal').classList.add('hidden');
    }

    async function handleProductSubmit(e) {
      e.preventDefault();
      const newProd = {
        name: document.getElementById('prodName').value,
        price: parseFloat(document.getElementById('prodPrice').value),
        stock: parseInt(document.getElementById('prodStock').value),
        imageUrl: document.getElementById('prodImage').value,
        description: document.getElementById('prodDesc').value,
        categoryId: "c1"
      };

      try {
        const res = await fetch('/api/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newProd)
        });
        if (res.ok) {
          alert('Produit ajouté avec succès !');
          closeAddProductModal();
          loadDashboard();
        }
      } catch (err) {
        alert('Erreur lors de l’ajout du produit');
      }
    }

    async function approveReview(id) {
      try {
        const res = await fetch(`/api/reviews/${id}/approve`, { method: 'PATCH' });
        if (res.ok) {
          loadDashboard();
        }
      } catch (err) {
        alert('Erreur lors de l’approbation de l’avis');
      }
    }

    async function deleteReview(id) {
      if (!confirm('Êtes-vous sûr de vouloir supprimer cet avis ?')) return;
      try {
        const res = await fetch(`/api/reviews/${id}`, { method: 'DELETE' });
        if (res.ok) {
          loadDashboard();
        }
      } catch (err) {
        alert('Erreur lors de la suppression de l’avis');
      }
    }

    async function saveSettings(e) {
      e.preventDefault();
      const updatedSettings = {
        storeName: document.getElementById('storeName').value,
        storeEmail: document.getElementById('storeEmail').value,
        phone: document.getElementById('phone').value,
        address: document.getElementById('address').value,
        logoUrl: document.getElementById('logoUrl').value,
        commissionRate: parseFloat(document.getElementById('commissionRate').value),
        minCommission: parseFloat(document.getElementById('minCommission').value)
      };

      try {
        const res = await fetch('/api/settings', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updatedSettings)
        });
        if (res.ok) {
          alert('Paramètres et seuils de commissions mis à jour avec succès !');
          loadDashboard();
        }
      } catch (err) {
        alert('Erreur lors de la mise à jour des paramètres');
      }
    }
  </script>
</body>
</html>
