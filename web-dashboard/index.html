<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JambarrTech • Dashboard Admin & Gérant</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
</head>
<body class="h-full bg-slate-100 font-sans text-slate-900">

  <!-- ==================== LOGIN SCREEN ==================== -->
  <div id="loginScreen" class="h-full flex items-center justify-center bg-gradient-to-br from-[#0A3C8C] to-[#0F52BA]">
    <div class="bg-white rounded-3xl p-8 w-full max-w-sm shadow-2xl space-y-6">
      <div class="text-center">
        <div class="w-14 h-14 bg-gradient-to-br from-[#0A3C8C] to-[#0F52BA] rounded-2xl flex items-center justify-center text-white font-black text-xl shadow-lg mx-auto ring-4 ring-blue-100">JT</div>
        <h1 class="mt-4 text-xl font-bold text-slate-800">JambarrShop</h1>
        <p class="text-xs text-slate-500 mt-1">Connexion au tableau de bord</p>
      </div>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="text-xs font-bold text-slate-600">Email</label>
          <input type="email" id="loginEmail" required placeholder="admin@jambarrtech.com"
            class="w-full mt-1 px-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0F52BA] focus:ring-2 focus:ring-blue-100 transition">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-600">Mot de passe</label>
          <input type="password" id="loginPassword" required placeholder="••••••••"
            class="w-full mt-1 px-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0F52BA] focus:ring-2 focus:ring-blue-100 transition">
        </div>
        <div id="loginError" class="hidden text-xs text-red-600 font-bold bg-red-50 p-2 rounded-lg"></div>
        <button type="submit" id="loginBtn"
          class="w-full py-3 bg-[#0F52BA] text-white font-bold rounded-xl shadow-lg hover:bg-blue-800 transition text-sm">
          Se connecter
        </button>
      </form>
    </div>
  </div>

  <!-- ==================== DASHBOARD (hidden by default) ==================== -->
  <div id="dashboardApp" class="h-full hidden flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col">
      <div class="p-6 border-b border-slate-100 flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-br from-[#0A3C8C] to-[#0F52BA] rounded-xl flex items-center justify-center text-white font-black text-lg shadow-md ring-2 ring-blue-100">JT</div>
        <div>
          <h1 class="font-bold text-base text-slate-800 tracking-tight">JambarrShop</h1>
          <p class="text-[10px] text-slate-500 font-semibold tracking-wider uppercase">Crée • Gère • Vends</p>
        </div>
      </div>
      <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
        <button onclick="switchTab('dashboard')" id="nav-dashboard" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-50 text-[#0F52BA] font-semibold text-sm transition">
          <span class="material-symbols-outlined">dashboard</span> Tableau de bord
        </button>
        <button onclick="switchTab('products')" id="nav-products" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 text-sm font-medium transition">
          <span class="material-symbols-outlined">inventory_2</span> Produits
        </button>
        <button onclick="switchTab('orders')" id="nav-orders" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 text-sm font-medium transition">
          <span class="material-symbols-outlined">shopping_bag</span> Commandes
        </button>
        <button onclick="switchTab('payments')" id="nav-payments" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 text-sm font-medium transition">
          <span class="material-symbols-outlined">payments</span> Paiements
        </button>
        <button onclick="switchTab('reviews')" id="nav-reviews" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 text-sm font-medium transition">
          <span class="material-symbols-outlined">star</span> Avis Clients
        </button>
        <button onclick="switchTab('customers')" id="nav-customers" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 text-sm font-medium transition">
          <span class="material-symbols-outlined">people</span> Clients
        </button>
        <button onclick="switchTab('logs')" id="nav-logs" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 text-sm font-medium transition">
          <span class="material-symbols-outlined">history</span> Journaux
        </button>
        <button onclick="switchTab('settings')" id="nav-settings" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 text-sm font-medium transition">
          <span class="material-symbols-outlined">settings</span> Paramètres
        </button>
      </nav>
      <div class="p-4 border-t border-slate-100">
        <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl">
          <div id="userAvatar" class="w-9 h-9 rounded-full bg-slate-300 flex items-center justify-center font-bold text-slate-700 text-xs"></div>
          <div class="flex-1 truncate">
            <p id="userName" class="text-xs font-bold text-slate-800 truncate"></p>
            <p id="userRole" class="text-[10px] text-slate-500 truncate"></p>
          </div>
          <button onclick="handleLogout()" class="text-slate-400 hover:text-red-500 transition" title="Déconnexion">
            <span class="material-symbols-outlined text-lg">logout</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">
      <header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between">
        <h2 id="pageTitle" class="text-lg font-bold text-slate-800">Tableau de bord</h2>
        <div class="flex items-center gap-4">
          <span id="apiStatus" class="px-3 py-1 bg-green-100 text-green-700 text-xs font-bold rounded-full">API Connecté</span>
          <button onclick="openAddProductModal()" id="btnAddProduct" class="px-4 py-2 bg-[#0F52BA] text-white text-xs font-bold rounded-xl shadow hover:bg-blue-800">+ Nouveau Produit</button>
        </div>
      </header>

      <div class="flex-1 p-8 overflow-y-auto space-y-8" id="mainContentArea"></div>
    </main>
  </div>

  <!-- ==================== ADD PRODUCT MODAL ==================== -->
  <div id="addProductModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-base text-slate-800">Ajouter un produit</h3>
        <button onclick="closeAddProductModal()" class="text-slate-400 font-bold hover:text-slate-600">✕</button>
      </div>
      <form onsubmit="handleProductSubmit(event)" class="space-y-3">
        <div>
          <label class="text-xs font-bold text-slate-600">Nom</label>
          <input type="text" id="prodName" required class="w-full mt-1 px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0F52BA]">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-bold text-slate-600">Référence</label>
            <input type="text" id="prodRef" required class="w-full mt-1 px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0F52BA]">
          </div>
          <div>
            <label class="text-xs font-bold text-slate-600">Catégorie</label>
            <select id="prodCategory" required class="w-full mt-1 px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0F52BA]"></select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-bold text-slate-600">Prix (FCFA)</label>
            <input type="number" id="prodPrice" required class="w-full mt-1 px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0F52BA]">
          </div>
          <div>
            <label class="text-xs font-bold text-slate-600">Stock</label>
            <input type="number" id="prodStock" required value="10" class="w-full mt-1 px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0F52BA]">
          </div>
        </div>
        <div>
          <label class="text-xs font-bold text-slate-600">URL image</label>
          <input type="url" id="prodImage" required class="w-full mt-1 px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0F52BA]">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-600">Description</label>
          <textarea id="prodDesc" rows="2" class="w-full mt-1 px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0F52BA]"></textarea>
        </div>
        <div class="flex gap-4">
          <label class="flex items-center gap-2 text-xs font-bold text-slate-600">
            <input type="checkbox" id="prodFeatured" class="rounded"> Vedette
          </label>
          <label class="flex items-center gap-2 text-xs font-bold text-slate-600">
            <input type="checkbox" id="prodFlash" class="rounded"> Flash
          </label>
        </div>
        <button type="submit" class="w-full py-3 bg-[#0F52BA] text-white font-bold rounded-xl text-sm shadow hover:bg-blue-800 mt-2">Enregistrer</button>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = '/api';
    let authToken = localStorage.getItem('jt_token');
    let currentUser = null;
    let currentTab = 'dashboard';
    let globalStats = null;
    let globalProducts = [];
    let globalOrders = [];
    let globalPayments = [];
    let globalReviews = [];
    let globalLogs = [];
    let globalSettings = {};
    let globalCustomers = [];
    let globalCategories = [];

    // ==================== API HELPER ====================
    async function api(path, options = {}) {
      const headers = { 'Content-Type': 'application/json', ...options.headers };
      if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
      const res = await fetch(`${API_BASE}${path}`, { ...options, headers });
      if (res.status === 401) { handleLogout(); throw new Error('Session expirée'); }
      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: 'Erreur réseau' }));
        throw new Error(err.error || `Erreur ${res.status}`);
      }
      return res.json();
    }

    // ==================== AUTH ====================
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errDiv = document.getElementById('loginError');
      btn.disabled = true;
      btn.textContent = 'Connexion...';
      errDiv.classList.add('hidden');

      try {
        const data = await api('/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value
          })
        });
        authToken = data.token;
        localStorage.setItem('jt_token', authToken);
        currentUser = data.user;
        showDashboard();
      } catch (err) {
        errDiv.textContent = err.message;
        errDiv.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Se connecter';
      }
    }

    function handleLogout() {
      authToken = null;
      currentUser = null;
      localStorage.removeItem('jt_token');
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('dashboardApp').classList.add('hidden');
    }

    async function checkAuth() {
      if (!authToken) return;
      try {
        currentUser = await api('/auth/me');
        showDashboard();
      } catch {
        handleLogout();
      }
    }

    function showDashboard() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('dashboardApp').classList.remove('hidden');
      document.getElementById('dashboardApp').classList.add('flex');

      const initials = currentUser.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
      document.getElementById('userAvatar').textContent = initials;
      document.getElementById('userName').textContent = currentUser.name;
      document.getElementById('userRole').textContent = currentUser.role === 'ADMIN' ? 'Super Administrateur' : 'Gérant Boutique';

      const isAdmin = currentUser.role === 'ADMIN';
      document.getElementById('btnAddProduct').style.display = (isAdmin || currentUser.role === 'MANAGER') ? '' : 'none';

      loadDashboard();
    }

    // ==================== DATA LOADING ====================
    async function loadDashboard() {
      try {
        const [stats, products, orders, payments, reviews, logs, settings, customers, categories] = await Promise.all([
          api('/stats').catch(() => null),
          api('/products').catch(() => []),
          api('/orders').catch(() => []),
          api('/payments').catch(() => []),
          api('/reviews').catch(() => []),
          api('/activity-logs').catch(() => []),
          api('/settings').catch(() => ({})),
          api('/customers').catch(() => []),
          api('/categories').catch(() => []),
        ]);
        globalStats = stats;
        globalProducts = products;
        globalOrders = orders;
        globalPayments = payments;
        globalReviews = reviews;
        globalLogs = logs;
        globalSettings = settings;
        globalCustomers = customers;
        globalCategories = categories;
        document.getElementById('apiStatus').textContent = 'API Connecté';
        document.getElementById('apiStatus').className = 'px-3 py-1 bg-green-100 text-green-700 text-xs font-bold rounded-full';
        renderTabContent();
      } catch (err) {
        document.getElementById('apiStatus').textContent = 'API Déconnecté';
        document.getElementById('apiStatus').className = 'px-3 py-1 bg-red-100 text-red-700 text-xs font-bold rounded-full';
        console.error('Erreur chargement:', err);
      }
    }

    // ==================== NAVIGATION ====================
    function switchTab(tab) {
      currentTab = tab;
      const tabs = ['dashboard', 'products', 'orders', 'payments', 'reviews', 'customers', 'logs', 'settings'];
      tabs.forEach(t => {
        const btn = document.getElementById('nav-' + t);
        if (btn) {
          btn.className = t === tab
            ? "w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-50 text-[#0F52BA] font-semibold text-sm transition"
            : "w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 text-sm font-medium transition";
        }
      });
      renderTabContent();
    }

    // ==================== RENDERING ====================
    function renderTabContent() {
      const area = document.getElementById('mainContentArea');
      const title = document.getElementById('pageTitle');

      if (currentTab === 'dashboard') {
        title.textContent = 'Tableau de bord Général';
        area.innerHTML = `
          <div class="grid grid-cols-4 gap-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
              <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Chiffre d'Affaires</p>
              <p class="text-2xl font-bold text-slate-800 mt-2">${(globalStats?.totalRevenue || 0).toLocaleString()} FCFA</p>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
              <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Commandes</p>
              <p class="text-2xl font-bold text-slate-800 mt-2">${globalStats?.ordersCount || 0}</p>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
              <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Clients</p>
              <p class="text-2xl font-bold text-slate-800 mt-2">${globalStats?.customersCount || 0}</p>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
              <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Panier Moyen</p>
              <p class="text-2xl font-bold text-slate-800 mt-2">${(globalStats?.averageBasket || 0).toLocaleString()} FCFA</p>
            </div>
          </div>
          ${globalStats?.lowStockProducts?.length ? `
          <div class="bg-white rounded-2xl border border-amber-200 shadow-sm p-6">
            <h3 class="font-bold text-base text-slate-800 mb-4">⚠️ Stock Critique</h3>
            <div class="space-y-2">
              ${globalStats.lowStockProducts.map(p => `
                <div class="flex justify-between items-center bg-amber-50 px-4 py-2 rounded-xl">
                  <span class="text-sm font-medium text-slate-800">${p.name}</span>
                  <span class="text-xs font-bold text-red-600">${p.stock} unités</span>
                </div>
              `).join('')}
            </div>
          </div>` : ''}
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
            <h3 class="font-bold text-base text-slate-800 mb-6">Commandes Récentes</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-slate-100 text-xs font-bold text-slate-400 uppercase">
                    <th class="pb-3">Réf</th><th class="pb-3">Client</th><th class="pb-3">Montant</th><th class="pb-3">Paiement</th><th class="pb-3">Statut</th>
                  </tr>
                </thead>
                <tbody class="text-sm divide-y divide-slate-100">
                  ${globalOrders.slice(0, 5).map(o => `
                    <tr>
                      <td class="py-4 font-bold text-slate-800">#${o.reference}</td>
                      <td class="py-4 text-slate-600">${o.clientName}</td>
                      <td class="py-4 font-bold text-[#0F52BA]">${o.totalAmount.toLocaleString()} FCFA</td>
                      <td class="py-4"><span class="px-2.5 py-1 bg-green-50 text-green-600 text-xs font-bold rounded-lg">${o.paymentMethod}</span></td>
                      <td class="py-4"><span class="px-2.5 py-1 bg-blue-50 text-blue-600 text-xs font-bold rounded-lg">${o.status}</span></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>`;

      } else if (currentTab === 'products') {
        title.textContent = 'Gestion des Produits';
        area.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
            <div class="flex justify-between items-center mb-6">
              <h3 class="font-bold text-base text-slate-800">Catalogue (${globalProducts.length})</h3>
              <button onclick="openAddProductModal()" class="px-4 py-2 bg-[#0F52BA] text-white text-xs font-bold rounded-xl shadow">+ Ajouter</button>
            </div>
            <div class="grid grid-cols-3 gap-6">
              ${globalProducts.map(p => `
                <div class="border border-slate-200 rounded-2xl p-4 flex flex-col justify-between bg-slate-50 relative">
                  ${p.stock < 5 ? '<span class="absolute top-3 right-3 flex h-3 w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span></span>' : ''}
                  <div class="aspect-square bg-white rounded-xl overflow-hidden mb-3">
                    <img src="${p.imageUrl}" class="w-full h-full object-cover" alt="${p.name}">
                  </div>
                  <div>
                    <h4 class="font-bold text-slate-800 text-sm">${p.name}</h4>
                    <p class="text-xs text-slate-500 mt-0.5">Réf: ${p.reference} • Stock: <span class="${p.stock < 5 ? 'text-red-600 font-bold' : ''}">${p.stock}</span></p>
                    <p class="text-base font-extrabold text-[#0F52BA] mt-2">${p.price.toLocaleString()} FCFA</p>
                  </div>
                  <div class="flex gap-2 mt-3">
                    <button onclick="deleteProduct('${p.id}')" class="flex-1 py-1.5 bg-red-50 text-red-600 text-xs font-bold rounded-xl hover:bg-red-100 transition">Supprimer</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>`;

      } else if (currentTab === 'orders') {
        title.textContent = 'Gestion des Commandes';
        const statusColors = { PENDING: 'bg-amber-50 text-amber-600', PROCESSING: 'bg-blue-50 text-blue-600', DELIVERED: 'bg-green-50 text-green-600', CANCELLED: 'bg-red-50 text-red-600' };
        area.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
            <h3 class="font-bold text-base text-slate-800 mb-6">Commandes (${globalOrders.length})</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-slate-100 text-xs font-bold text-slate-400 uppercase">
                    <th class="pb-3">Réf</th><th class="pb-3">Client</th><th class="pb-3">Téléphone</th><th class="pb-3">Montant</th><th class="pb-3">Paiement</th><th class="pb-3">Statut</th><th class="pb-3">Actions</th>
                  </tr>
                </thead>
                <tbody class="text-sm divide-y divide-slate-100">
                  ${globalOrders.map(o => `
                    <tr>
                      <td class="py-4 font-bold text-slate-800">#${o.reference}</td>
                      <td class="py-4 text-slate-600">${o.clientName}</td>
                      <td class="py-4 text-slate-500 text-xs">${o.clientPhone || '-'}</td>
                      <td class="py-4 font-bold text-[#0F52BA]">${o.totalAmount.toLocaleString()} FCFA</td>
                      <td class="py-4"><span class="px-2.5 py-1 bg-green-50 text-green-600 text-xs font-bold rounded-lg">${o.paymentMethod}</span></td>
                      <td class="py-4"><span class="px-2.5 py-1 ${statusColors[o.status] || 'bg-slate-50 text-slate-600'} text-xs font-bold rounded-lg">${o.status}</span></td>
                      <td class="py-4">
                        <select onchange="updateOrderStatus('${o.id}', this.value)" class="text-xs border border-slate-200 rounded-lg px-2 py-1 focus:outline-none">
                          <option value="PENDING" ${o.status === 'PENDING' ? 'selected' : ''}>En attente</option>
                          <option value="PROCESSING" ${o.status === 'PROCESSING' ? 'selected' : ''}>En cours</option>
                          <option value="DELIVERED" ${o.status === 'DELIVERED' ? 'selected' : ''}>Livrée</option>
                          <option value="CANCELLED" ${o.status === 'CANCELLED' ? 'selected' : ''}>Annulée</option>
                        </select>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>`;

      } else if (currentTab === 'payments') {
        title.textContent = 'Transactions de Paiement';
        area.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
            <h3 class="font-bold text-base text-slate-800 mb-6">Transactions (${globalPayments.length})</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-slate-100 text-xs font-bold text-slate-400 uppercase">
                    <th class="pb-3">Réf</th><th class="pb-3">Client</th><th class="pb-3">Méthode</th><th class="pb-3">Montant</th><th class="pb-3">Statut</th>
                  </tr>
                </thead>
                <tbody class="text-sm divide-y divide-slate-100">
                  ${globalPayments.map(tx => `
                    <tr>
                      <td class="py-4 font-bold text-slate-800">${tx.reference}</td>
                      <td class="py-4 text-slate-600">${tx.clientName}</td>
                      <td class="py-4"><span class="px-2.5 py-1 bg-blue-50 text-[#0F52BA] text-xs font-bold rounded-lg">${tx.method}</span></td>
                      <td class="py-4 font-bold text-[#0F52BA]">${tx.amount.toLocaleString()} FCFA</td>
                      <td class="py-4"><span class="px-2.5 py-1 bg-emerald-50 text-emerald-600 text-xs font-bold rounded-lg">${tx.status}</span></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>`;

      } else if (currentTab === 'reviews') {
        title.textContent = 'Modération des Avis';
        const pending = globalReviews.filter(r => r.status === 'pending');
        const approved = globalReviews.filter(r => r.status === 'approved');
        area.innerHTML = `
          <div class="space-y-8">
            <div class="bg-white rounded-2xl border border-amber-200 shadow-sm p-6">
              <h3 class="font-bold text-base text-slate-800 mb-4">En attente (${pending.length})</h3>
              ${pending.length === 0 ? '<p class="text-xs text-slate-400 italic">Aucun avis en attente.</p>' : pending.map(r => `
                <div class="border border-amber-200 rounded-2xl p-4 bg-amber-50/50 mb-3">
                  <div class="flex justify-between items-center mb-2">
                    <span class="font-bold text-xs text-slate-800">${r.clientName}</span>
                    <span class="text-amber-500 font-bold text-xs">${'★'.repeat(r.rating)}</span>
                  </div>
                  <p class="text-xs text-slate-700 italic mb-3">"${r.comment}"</p>
                  <div class="flex justify-end gap-2">
                    <button onclick="deleteReview('${r.id}')" class="px-3 py-1.5 bg-white border border-red-200 text-red-600 text-xs font-bold rounded-xl hover:bg-red-50">Supprimer</button>
                    <button onclick="approveReview('${r.id}')" class="px-4 py-1.5 bg-emerald-600 text-white text-xs font-bold rounded-xl shadow hover:bg-emerald-700">Approuver</button>
                  </div>
                </div>
              `).join('')}
            </div>
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
              <h3 class="font-bold text-base text-slate-800 mb-4">Approuvés (${approved.length})</h3>
              ${approved.map(r => `
                <div class="border border-slate-200 rounded-2xl p-4 bg-slate-50 mb-3">
                  <div class="flex justify-between items-center mb-2">
                    <span class="font-bold text-xs text-slate-800">${r.clientName}</span>
                    <span class="text-amber-500 font-bold text-xs">${'★'.repeat(r.rating)}</span>
                  </div>
                  <p class="text-xs text-slate-600">"${r.comment}"</p>
                </div>
              `).join('')}
            </div>
          </div>`;

      } else if (currentTab === 'customers') {
        title.textContent = 'Gestion des Clients';
        area.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
            <h3 class="font-bold text-base text-slate-800 mb-6">Clients (${globalCustomers.length})</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-slate-100 text-xs font-bold text-slate-400 uppercase">
                    <th class="pb-3">Nom</th><th class="pb-3">Téléphone</th><th class="pb-3">Email</th><th class="pb-3">Commandes</th><th class="pb-3">Total Dépensé</th>
                  </tr>
                </thead>
                <tbody class="text-sm divide-y divide-slate-100">
                  ${globalCustomers.map(c => `
                    <tr>
                      <td class="py-4 font-bold text-slate-800">${c.name}</td>
                      <td class="py-4 text-slate-600">${c.phone}</td>
                      <td class="py-4 text-slate-500 text-xs">${c.email || '-'}</td>
                      <td class="py-4 text-center">${c.ordersCount}</td>
                      <td class="py-4 font-bold text-[#0F52BA]">${c.totalSpent.toLocaleString()} FCFA</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>`;

      } else if (currentTab === 'logs') {
        title.textContent = "Journaux d'Activité";
        area.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
            <h3 class="font-bold text-base text-slate-800 mb-6">Logs (${globalLogs.length})</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-slate-100 text-xs font-bold text-slate-400 uppercase">
                    <th class="pb-3">Action</th><th class="pb-3">Utilisateur</th><th class="pb-3">Module</th><th class="pb-3">Date</th><th class="pb-3">Résultat</th>
                  </tr>
                </thead>
                <tbody class="text-sm divide-y divide-slate-100">
                  ${globalLogs.map(l => `
                    <tr>
                      <td class="py-4 font-bold text-slate-800">${l.action}</td>
                      <td class="py-4 text-slate-600">${l.user}</td>
                      <td class="py-4"><span class="px-2.5 py-1 bg-slate-100 text-slate-700 text-xs font-bold rounded-lg">${l.module}</span></td>
                      <td class="py-4 text-xs text-slate-400">${new Date(l.createdAt).toLocaleString('fr-FR')}</td>
                      <td class="py-4"><span class="px-2.5 py-1 bg-green-50 text-green-600 text-xs font-bold rounded-lg">${l.result}</span></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>`;

      } else if (currentTab === 'settings') {
        title.textContent = 'Paramètres';
        area.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 max-w-3xl">
            <h3 class="font-bold text-base text-slate-800 mb-6">Configuration de la Boutique</h3>
            <form onsubmit="saveSettings(event)" class="space-y-6">
              <div class="grid grid-cols-2 gap-6">
                <div>
                  <label class="text-xs font-bold text-slate-600">Nom de la boutique</label>
                  <input type="text" id="setStoreName" value="${globalSettings.storeName || ''}" class="w-full mt-1.5 px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0F52BA]">
                </div>
                <div>
                  <label class="text-xs font-bold text-slate-600">Email</label>
                  <input type="email" id="setStoreEmail" value="${globalSettings.storeEmail || ''}" class="w-full mt-1.5 px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0F52BA]">
                </div>
              </div>
              <div class="grid grid-cols-2 gap-6">
                <div>
                  <label class="text-xs font-bold text-slate-600">Téléphone</label>
                  <input type="text" id="setPhone" value="${globalSettings.phone || ''}" class="w-full mt-1.5 px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0F52BA]">
                </div>
                <div>
                  <label class="text-xs font-bold text-slate-600">Adresse</label>
                  <input type="text" id="setAddress" value="${globalSettings.address || ''}" class="w-full mt-1.5 px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0F52BA]">
                </div>
              </div>
              <div class="grid grid-cols-2 gap-6">
                <div>
                  <label class="text-xs font-bold text-slate-600">Taux Commission (%)</label>
                  <input type="number" step="0.1" id="setCommission" value="${globalSettings.commissionRate || 5.0}" class="w-full mt-1.5 px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0F52BA]">
                </div>
                <div>
                  <label class="text-xs font-bold text-slate-600">Commission Min (FCFA)</label>
                  <input type="number" id="setMinCommission" value="${globalSettings.minCommission || 500}" class="w-full mt-1.5 px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#0F52BA]">
                </div>
              </div>
              <button type="submit" class="px-6 py-3 bg-[#0F52BA] text-white font-bold rounded-xl text-sm shadow hover:bg-blue-800 transition">Enregistrer</button>
            </form>
          </div>`;
      }
    }

    // ==================== ACTIONS ====================
    function openAddProductModal() {
      const select = document.getElementById('prodCategory');
      select.innerHTML = globalCategories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      document.getElementById('addProductModal').classList.remove('hidden');
    }

    function closeAddProductModal() {
      document.getElementById('addProductModal').classList.add('hidden');
    }

    async function handleProductSubmit(e) {
      e.preventDefault();
      try {
        await api('/products', {
          method: 'POST',
          body: JSON.stringify({
            name: document.getElementById('prodName').value,
            reference: document.getElementById('prodRef').value,
            price: parseFloat(document.getElementById('prodPrice').value),
            stock: parseInt(document.getElementById('prodStock').value),
            imageUrl: document.getElementById('prodImage').value,
            categoryId: document.getElementById('prodCategory').value,
            description: document.getElementById('prodDesc').value,
            isFeatured: document.getElementById('prodFeatured').checked,
            isFlash: document.getElementById('prodFlash').checked,
          })
        });
        closeAddProductModal();
        loadDashboard();
      } catch (err) {
        alert('Erreur: ' + err.message);
      }
    }

    async function deleteProduct(id) {
      if (!confirm('Supprimer ce produit ?')) return;
      try {
        await api(`/products/${id}`, { method: 'DELETE' });
        loadDashboard();
      } catch (err) { alert(err.message); }
    }

    async function updateOrderStatus(id, status) {
      try {
        await api(`/orders/${id}/status`, { method: 'PATCH', body: JSON.stringify({ status }) });
        loadDashboard();
      } catch (err) { alert(err.message); }
    }

    async function approveReview(id) {
      try {
        await api(`/reviews/${id}/approve`, { method: 'PATCH' });
        loadDashboard();
      } catch (err) { alert(err.message); }
    }

    async function deleteReview(id) {
      if (!confirm('Supprimer cet avis ?')) return;
      try {
        await api(`/reviews/${id}`, { method: 'DELETE' });
        loadDashboard();
      } catch (err) { alert(err.message); }
    }

    async function saveSettings(e) {
      e.preventDefault();
      try {
        await api('/settings', {
          method: 'PUT',
          body: JSON.stringify({
            storeName: document.getElementById('setStoreName').value,
            storeEmail: document.getElementById('setStoreEmail').value,
            phone: document.getElementById('setPhone').value,
            address: document.getElementById('setAddress').value,
            commissionRate: parseFloat(document.getElementById('setCommission').value),
            minCommission: parseFloat(document.getElementById('setMinCommission').value),
          })
        });
        alert('Paramètres sauvegardés !');
        loadDashboard();
      } catch (err) { alert(err.message); }
    }

    // ==================== INIT ====================
    checkAuth();
  </script>
</body>
</html>
